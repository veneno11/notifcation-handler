name: InkLit Reminders

on:
  schedule:
    - cron: '23 * * * *'   # every hour at minute 23; GitHub often starts it 5-30 min late
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a preview now to the device that opened InkLit last (saves nothing)'
        type: boolean
        default: false

concurrency:
  group: inklit-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: node inklit-reminders.js
        env:
          INKLIT_SERVICE_ACCOUNT: ${{ secrets.INKLIT_SERVICE_ACCOUNT }}
          INKLIT_TEST: ${{ inputs.test }}
