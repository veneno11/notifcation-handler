name: Training Reminder
on:
  schedule:
    - cron: '0 20 * * *'
      timezone: 'America/Guatemala'   # 8 PM Guatemala, all year
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node train-reminder.js
        env:
          LIFEOS_SERVICE_ACCOUNT: ${{ secrets.LIFEOS_SERVICE_ACCOUNT }}
