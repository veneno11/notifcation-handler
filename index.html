<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1012" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grades" />
  <title>Grades</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234F8CFF'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='34' width='9' height='16' rx='3' fill='%23fff' fill-opacity='.55'/%3E%3Crect x='27.5' y='26' width='9' height='24' rx='3' fill='%23fff' fill-opacity='.78'/%3E%3Crect x='41' y='16' width='9' height='34' rx='3' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0F1012; --surface: #18191C; --surface-2: #212226; --surface-3: #2C2D33;
      --line: rgba(255,255,255,.07);
      --text: #EEEEF0; --text-2: #A3A4AA; --text-3: #6F7078;
      --blue: #4F8CFF; --violet: #A084FF; --green: #3CCB7F; --yellow: #F4B740; --orange: #FF8A3D;
      --red: #FF6B6B; --cyan: #2CC7D6; --teal: #2DD4BF; --pink: #F472B6;
      --radius: 22px; --tabbar-h: 64px;
      --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: "SamsungOne", "Samsung Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
    button:disabled { cursor: default; }
    a { color: inherit; text-decoration: none; }
    code, .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; overflow-x: clip; padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 28px); }

    /* Header: One UI-style large title that collapses into a top bar */
    .topbar { position: fixed; inset: 0 0 auto; z-index: 20; padding-top: var(--safe-t); background: rgba(15,16,18,.84); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; }
    .topbar.show { opacity: 1; transform: none; pointer-events: auto; }
    .topbar-inner { max-width: 560px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 22px; font-weight: 650; font-size: 17px; }
    .actions { display: flex; gap: 2px; }
    .hero { --g1: rgba(79,140,255,.24); --g2: rgba(160,132,255,.2); position: relative; isolation: isolate; min-height: clamp(200px, 33vh, 310px); padding: calc(var(--safe-t) + 16px) 22px 22px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero::before { content: ""; position: absolute; inset: 0 -60px -40px; z-index: -1; pointer-events: none; background: radial-gradient(50% 55% at 18% 45%, var(--g1), transparent 70%), radial-gradient(45% 50% at 88% 12%, var(--g2), transparent 70%); }
    .hero .actions { position: absolute; top: calc(var(--safe-t) + 8px); right: 8px; }
    .eyebrow { margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text-2); }
    .hero h1 { margin: 0; font-size: 38px; font-weight: 750; letter-spacing: -.03em; line-height: 1.05; }
    .status { --c: var(--green); display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 12px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); transition: background .15s, color .15s; }
    .icon-btn:active { background: var(--surface-2); }
    .icon-btn.spinning { color: var(--blue); }
    .icon-btn.spinning svg { animation: spin 1s linear infinite; }

    /* Layout */
    .content { padding: 0 14px; display: flex; flex-direction: column; gap: 18px; }
    .section { display: flex; flex-direction: column; gap: 9px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
    .section-head h2 { --c: var(--text-2); display: flex; align-items: center; gap: 7px; margin: 0; font-size: 13.5px; font-weight: 650; color: var(--text); }
    .section-head h2 svg { color: var(--c); }
    .section-head h2 span { color: var(--text-3); font-weight: 500; }
    .h-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .link { color: var(--blue); font-weight: 600; font-size: 13.5px; }
    .caption { margin: -8px 8px 0; color: var(--text-3); font-size: 12.5px; }
    .muted { color: var(--text-2); }
    .danger-text { color: var(--red); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .notice p { margin: 0 0 12px; color: var(--text-2); }
    .notice b { color: var(--text); }
    .warn-card { background: color-mix(in srgb, var(--yellow) 8%, var(--surface)); border-color: color-mix(in srgb, var(--yellow) 25%, transparent); color: var(--yellow); font-size: 14px; }
    .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 18px; text-align: center; color: var(--text-2); font-size: 14px; }
    .empty .icon { --c: var(--green); width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }

    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .list > * + * { border-top: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; }
    button.row:active, a.row:active, .up:active { background: var(--surface-2); }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { margin-top: 2px; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub.wrap { white-space: normal; }
    .row-icon { --c: var(--blue); width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
    .note { margin-top: 6px; color: var(--text-3); font-size: 12.5px; }
    .dot-new { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 8px var(--violet); vertical-align: 1px; }

    /* Tags & badges */
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; min-width: 0; }
    .tag { --c: var(--text-2); display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 80%, white); font-size: 12px; font-weight: 600; }
    .tag > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag > i { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: var(--c); }
    .meta { font-size: 12px; color: var(--text-3); }
    .due { font-size: 12px; font-weight: 650; }
    .score { --c: var(--text-2); flex-shrink: 0; min-width: 66px; padding: 7px 10px; border-radius: 14px; text-align: right; background: color-mix(in srgb, var(--c) 13%, transparent); }
    .score b { display: block; color: var(--c); font-size: 16px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .score .of { color: var(--text-3); font-size: 12.5px; font-weight: 500; }
    .score small { display: block; margin-top: 1px; color: var(--text-3); font-size: 11.5px; }

    /* Upcoming rows */
    .up { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 14px 14px 16px; text-align: left; }
    .up[role="button"] { cursor: pointer; }
    .date-tile { --c: var(--text-2); width: 48px; flex-shrink: 0; padding: 7px 0 6px; border-radius: 14px; text-align: center; line-height: 1.1; background: color-mix(in srgb, var(--c) 15%, var(--surface-2)); color: var(--c); }
    .date-tile small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .date-tile b { font-size: 19px; color: var(--text); }
    .up.open .row-title { white-space: normal; }
    .up.done .row-title { color: var(--text-3); text-decoration: line-through; }
    .up.done .date-tile { opacity: .55; }
    .desc { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--text-2); font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
    .more { margin-top: 6px; color: var(--text-3); font-size: 12px; }
    .check { width: 30px; height: 30px; flex-shrink: 0; align-self: center; border-radius: 50%; border: 2px solid var(--surface-3); display: grid; place-items: center; color: transparent; transition: background .2s, border-color .2s, transform .15s; }
    .check:active { transform: scale(.88); }
    .check.on { background: var(--green); border-color: var(--green); color: #0F1012; animation: pop .3s ease; }

    /* Home summary */
    .summary { padding: 18px; background: linear-gradient(145deg, color-mix(in srgb, var(--blue) 15%, var(--surface)) 0%, var(--surface) 50%, color-mix(in srgb, var(--violet) 12%, var(--surface)) 100%); }
    .summary-top { display: flex; align-items: center; gap: 16px; }
    .summary-text { flex: 1; min-width: 0; }
    .summary-text small { display: block; margin-bottom: 4px; color: var(--text-2); font-size: 12.5px; font-weight: 600; }
    .summary-line { --c: var(--blue); display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 13.5px; min-width: 0; }
    .summary-line i { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: var(--c); }
    .summary-line span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
    .summary-line b { font-variant-numeric: tabular-nums; }
    .ring { flex-shrink: 0; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .stat { --c: var(--blue); display: flex; flex-direction: column; align-items: flex-start; gap: 7px; min-width: 0; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line); text-align: left; }
    button.stat:active { background: rgba(255,255,255,.08); }
    .stat .chip { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
    .stat b { font-size: 19px; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 11.5px; color: var(--text-2); white-space: nowrap; }

    /* Classes */
    .mono { --c: var(--blue); width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; font-size: 15px; font-weight: 750; letter-spacing: .02em; color: color-mix(in srgb, var(--c) 35%, white); background: color-mix(in srgb, var(--c) 30%, var(--surface-2)); }
    .mono.lg { width: 56px; height: 56px; border-radius: 18px; font-size: 19px; }
    .class-card { --c: var(--blue); display: block; width: 100%; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); text-align: left; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, var(--surface)) 0%, var(--surface) 55%); transition: transform .12s; }
    .class-card:active { transform: scale(.985); }
    .class-top { display: flex; align-items: center; gap: 12px; }
    .class-name { font-size: 16px; font-weight: 650; line-height: 1.3; }
    .class-grade { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .class-avg { font-size: 26px; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; margin-top: 14px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; transition: width .6s ease; }
    .class-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text-3); font-size: 12.5px; }
    .class-meta .chev { margin-left: auto; display: grid; color: var(--text-3); }
    .scroller { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -14px; padding: 2px 14px 6px; scrollbar-width: none; }
    .scroller::-webkit-scrollbar { display: none; }
    .class-tile { --c: var(--blue); scroll-snap-align: start; flex: 0 0 136px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; border: 1px solid var(--line); text-align: left; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, var(--surface)) 0%, var(--surface) 70%); }
    .class-tile:active { transform: scale(.97); }
    .tile-name { min-height: 34px; font-size: 13.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tile-avg { font-size: 22px; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
    .tile-avg small { font-size: 13px; color: var(--text-2); font-weight: 600; }

    /* Upcoming tab */
    .alert-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--red) 15%, var(--surface)), var(--surface) 70%); }
    .alert-card .icon { width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
    .alert-card b { display: block; font-size: 16px; }
    .alert-card .row-main > span { font-size: 13px; color: var(--text-2); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; }
    .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
    .seg button { padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
    .seg button span { margin-left: 5px; color: var(--text-3); }
    .seg button.on { background: var(--surface-3); color: var(--text); }
    .btn-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); font-size: 13.5px; font-weight: 650; }
    .btn-pill:active { transform: scale(.96); }

    /* Tab bar */
    .tabbar { position: fixed; inset: auto 0 0; z-index: 30; padding: 6px 12px calc(6px + var(--safe-b)); background: rgba(15,16,18,.88); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
    .tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--text-3); font-size: 11.5px; font-weight: 600; text-align: center; }
    .tab .ico { position: relative; width: 60px; height: 32px; display: grid; place-items: center; border-radius: 999px; transition: background .2s, color .2s; }
    .tab.active { color: var(--text); }
    .tab.active .ico { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); }
    .tab-dot { position: absolute; top: 3px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--violet); border: 2px solid var(--bg); }

    /* Bottom sheets */
    .sheet-wrap { position: fixed; inset: 0; z-index: 50; }
    .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); animation: fade .25s ease; transition: opacity .22s; }
    .sheet-wrap.closing .scrim { opacity: 0; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; max-height: 90vh; max-height: 90dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; padding-bottom: var(--safe-b); animation: sheetIn .32s cubic-bezier(.2,.8,.2,1); transition: transform .22s ease; }
    .sheet-grip { display: grid; place-items: center; padding: 10px 0; touch-action: none; cursor: grab; }
    .sheet-grip span { width: 40px; height: 5px; border-radius: 99px; background: var(--surface-3); }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 18px 24px; display: flex; flex-direction: column; gap: 12px; }
    .sheet .list, .sheet .card { background: var(--surface-2); }
    .sheet button.row:active, .sheet a.row:active { background: var(--surface-3); }
    .sheet .section-head { padding: 6px 4px 0; }
    .sheet-head { display: flex; align-items: center; gap: 14px; }
    .sheet-head h3, .sheet-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
    .sheet-head p { margin: 3px 0 0; color: var(--text-2); font-size: 14px; }
    .mini-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .mini-stats div { padding: 10px; border-radius: 14px; background: rgba(255,255,255,.05); min-width: 0; }
    .mini-stats b { display: block; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .mini-stats span { font-size: 11.5px; color: var(--text-2); }
    .cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px; padding: 12px 16px; }
    .cat-row .bar { grid-column: 1 / -1; margin-top: 10px; }
    .cat-pct { font-weight: 700; font-variant-numeric: tabular-nums; }
    .cat-pct small { color: var(--text-3); font-weight: 500; }
    .link-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--blue); font-weight: 600; font-size: 14px; }
    .setup p { margin: 0 0 12px; color: var(--text-2); font-size: 13.5px; }
    .setup b { color: var(--text); }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .input-row .field { flex: 1; min-width: 0; padding: 12px 14px; }

    /* Misc */
    .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px); z-index: 60; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; width: max-content; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 14px; background: var(--surface-3); color: var(--text); font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45); animation: toastIn .25s ease; }
    .toast button { color: var(--blue); font-weight: 700; }
    .btn { display: block; width: 100%; padding: 15px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 650; text-align: center; }
    .btn:disabled { opacity: .6; }
    .btn.small { width: auto; padding: 9px 16px; font-size: 14px; flex-shrink: 0; }
    .btn.ghost { background: var(--surface-3); color: var(--text); }
    .btn.danger { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); margin-top: 6px; }
    .spinner { width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--blue); animation: spin .8s linear infinite; }
    .spinner.sm { width: 14px; height: 14px; }
    .uid { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--text-2); }
    .uid code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); text-align: left; }
    .auth { min-height: 100vh; min-height: 100dvh; max-width: 400px; margin: 0 auto; padding: 24px 22px calc(24px + var(--safe-b)); display: flex; flex-direction: column; justify-content: center; }
    .auth h1 { margin: 20px 0 6px; font-size: 30px; font-weight: 750; letter-spacing: -.02em; }
    .auth p { margin: 0; }
    .auth-form { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
    .field { width: 100%; padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; outline: none; transition: border-color .15s; }
    .sheet .field { background: var(--surface-3); }
    .field:focus { border-color: var(--blue); }
    .form-msg { margin: 8px 4px 0; font-size: 14px; }
    .form-msg.error { color: var(--red); }
    .form-msg.ok { color: var(--green); }
    .auth .link { display: block; margin: 20px auto 0; }
    .splash { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
    .splash svg { animation: pulse 1.4s ease-in-out infinite; }
    .sk { border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }

    @keyframes sheetIn { from { transform: translateY(100%); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.94); } }
    @keyframes pop { 50% { transform: scale(1.18); } }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @media (hover: hover) {

    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

<body>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    /* ===== Your settings ===== */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDWqQ36p41VuyW7SjQ6oUlJ-6Na4KOGp44",
      authDomain: "personal-api-15935.firebaseapp.com",
      projectId: "personal-api-15935",
      storageBucket: "personal-api-15935.firebasestorage.app",
      messagingSenderId: "310881556113",
      appId: "1:310881556113:web:4837ead6568ea7b98e5130",
    };
    const VAPID_KEY = "NDfVp3jlO1SCqjvx6dPwYOUsAym1"; // ← copy this line from your current index.html
    const GITHUB = { repo: "veneno11/personalApi", workflow: "scrape.yml", branch: "main" };

  // Class colors: the first pattern that matches a class name wins (capitals and accents are ignored)
    const CLASS_COLORS = [
      [/a\.\s*litera|english|ingles/, "#3CCB7F"],       // A.Litera11 (English): green
      [/^literatura|spanish|espanol/, "#FF6B6B"],       // Literatura (Spanish): red
      [/alem|german/, "#FF6B6B"],                       // AlemA1.1HS (German): red
      [/precalc|calc|math|matemat|algebra/, "#4F8CFF"], // AP PreCalc (Math): blue
      [/chem|quimic/, "#FF8A3D"],                       // AP Chem: orange
      [/compsci|comp.*sci|computer|computac/, "#F472B6"], // CompSci 11: pink
      [/elabpro|elaboracion|proyecto/, "#A084FF"],      // ElabPro11: purple
      [/filosof|philosoph/, "#F4B740"],                 // Filosofi11: amber
      [/bkb|basket|baloncesto|basquet/, "#8A8B93"],     // BKB MascHS (Basketball): no color
    ];
    // Classes that don't match anything above get these, in order
    const OTHER_CLASS_COLORS = ["#2CC7D6", "#A3E635", "#818CF8", "#E879F9", "#2DD4BF"];
    /* ========================= */

    const PLUSPORTALS_URL = "https://www.plusportals.com/VillageSchool";
    const NEW_FOR_MS = 3 * 864e5;            // "New" badge lasts 3 days
    const STALE_AFTER_MS = 26 * 36e5;        // warn if no update in 26 hours
    const AUTO_REFRESH_AFTER_MS = 10 * 6e4;  // refresh on open if data is older than 10 minutes
    const REFRESH_COOLDOWN_MS = 3 * 6e4;     // never auto-refresh more than once every 3 minutes
    const REFRESH_TIMEOUT_MS = 5 * 6e4;
    const DEVICE_KEY = "grades.pushDevice";
    const REFRESH_KEY = "grades.lastRefresh";

    const configured = !FIREBASE_CONFIG.apiKey.startsWith("PASTE");
    if (configured) firebase.initializeApp(FIREBASE_CONFIG);
    const auth = configured ? firebase.auth() : null;
    const db = configured ? firebase.firestore() : null;
    const SW_URL = `firebase-messaging-sw.js?config=${encodeURIComponent(JSON.stringify(FIREBASE_CONFIG))}`;
    if (configured && "serviceWorker" in navigator) navigator.serviceWorker.register(SW_URL).catch(() => {});

    /* ---------- Helpers ---------- */
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      del: k => { try { localStorage.removeItem(k); } catch {} },
    };
    const isTrue = v => String(v).toLowerCase() === "true";
    const num = v => {
      if (v === null || v === undefined || v === "") return null;
      const n = parseFloat(String(v).replace("%", ""));
      return Number.isFinite(n) ? n : null;
    };
    const fmt = v => (v == null ? "—" : Number.isInteger(v) ? String(v) : v.toFixed(1));
    const clamp = v => Math.max(0, Math.min(100, v || 0));
    const ts = d => (d ? d.getTime() : 0);
    const tsLast = d => (d ? d.getTime() : Number.MAX_SAFE_INTEGER);
    const isNewItem = it => typeof it?.firstSeen === "number" && it.firstSeen > 0 && Date.now() - it.firstSeen < NEW_FOR_MS;
    const titleCase = s => String(s).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
    const hashNum = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; };
    const doneKeyOf = u => "u" + hashNum([u.AssignmentID, u.LessonActivityID, u.DiscussionTopicID, u.SectionID, u.Title].map(v => String(v ?? "")).join("|")).toString(36);
    const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const namedColor = name => {
      const n = norm(name);
      const hit = CLASS_COLORS.find(([re]) => re.test(n));
      return hit ? hit[1] : null;
    };

    // Teacher-entered text can contain HTML; keep only the plain text
    function clean(value) {
      if (value === null || value === undefined || value === "") return "";
      const text = new DOMParser().parseFromString(String(value), "text/html").body.textContent || "";
      return text.replace(/\u00a0/g, " ").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    // PlusPortals dates are calendar days; read them without timezone shifts
    function parseDay(v) {
      if (v === null || v === undefined || v === "") return null;
      if (typeof v === "object" && typeof v.toDate === "function") v = v.toDate().getTime();
      const s = String(v);
      let m = s.match(/\/Date\((-?\d+)/);
      if (m || typeof v === "number") {
        const d = new Date(m ? Number(m[1]) : v);
        return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      }
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(+m[1], m[2] - 1, +m[3]);
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return new Date(+m[3], m[1] - 1, +m[2]);
      const d = new Date(s);
      return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    const startOfToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
    const daysFromToday = d => Math.round((d - startOfToday()) / 864e5);
    const shortDate = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

    function dueLabel(d) {
      if (!d) return "No due date";
      const n = daysFromToday(d);
      if (n === 0) return "Due today";
      if (n === 1) return "Due tomorrow";
      if (n === -1) return "Was due yesterday";
      if (n < 0) return `Was due ${shortDate(d)}`;
      if (n < 7) return `Due ${d.toLocaleDateString(undefined, { weekday: "long" })}`;
      return `Due ${d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}`;
    }
    function urgency(d, done) {
      if (done) return "var(--green)";
      if (!d) return "var(--text-2)";
      const n = daysFromToday(d);
      if (n < 0) return "var(--red)";
      if (n === 0) return "var(--orange)";
      if (n === 1) return "var(--yellow)";
      if (n < 7) return "var(--blue)";
      return "var(--text-2)";
    }
    const BUCKETS = [
      ["Past", "var(--red)"], ["Today", "var(--orange)"], ["Tomorrow", "var(--yellow)"],
      ["This week", "var(--blue)"], ["Later", "var(--violet)"], ["No due date", "var(--text-3)"],
    ];
    function bucket(d) {
      if (!d) return "No due date";
      const n = daysFromToday(d);
      if (n < 0) return "Past";
      if (n === 0) return "Today";
      if (n === 1) return "Tomorrow";
      if (n < 7) return "This week";
      return "Later";
    }
    function tone(pct) {
      if (pct == null) return "var(--text-2)";
      if (pct >= 90) return "var(--green)";
      if (pct >= 80) return "var(--blue)";
      if (pct >= 70) return "var(--yellow)";
      return "var(--red)";
    }
    const TYPE_COLORS = [
      [/test|exam|prueba|evaluac/i, "var(--red)"],
      [/quiz|comprob/i, "var(--violet)"],
      [/project|proyect/i, "var(--orange)"],
      [/discuss|foro|forum|debate/i, "var(--cyan)"],
      [/lab/i, "var(--teal)"],
      [/home|tarea|assign|hoja|worksheet/i, "var(--blue)"],
      [/class|clase|activ|particip|zona/i, "var(--green)"],
      [/read|lectur|essay|ensayo|writ/i, "var(--pink)"],
    ];
    const typeColor = s => (TYPE_COLORS.find(([re]) => re.test(s || "")) || [null, "var(--text-2)"])[1];

    function monogram(name) {
      const words = String(name).replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean);
      if (!words.length) return "?";
      const second = words.slice(1).find(w => w.length > 2 && /\p{L}/u.test(w[0]));
      return (second ? words[0][0] + second[0] : words[0].slice(0, 2)).toUpperCase();
    }
    function relTime(date) {
      if (!date) return "never";
      const s = (Date.now() - date.getTime()) / 1000;
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
      const days = Math.floor(s / 86400);
      return days === 1 ? "yesterday" : `${days} days ago`;
    }
    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    }

    /* ---------- Data model ---------- */
    function buildModel(data, dash) {
      const sorted = (data.classes || [])
        .map(c => ({ c, name: clean(c.name) || "Class" }))
        .sort((a, b) => a.name.localeCompare(b.name));

      let otherIndex = 0;
      const classes = sorted.map(({ c, name }) => {
        const color = namedColor(name) || OTHER_CLASS_COLORS[otherIndex++ % OTHER_CLASS_COLORS.length];
        const assignments = (c.assignments || []).map(a => {
          const score = num(a.Score);
          const possible = num(a.PossiblePoints);
          const scoreText = a.Score === null || a.Score === undefined || String(a.Score).trim() === "" ? null : String(a.Score).trim();
          const category = clean(a.Category);
          return {
            title: clean(a.Description) || clean(a.ShortName) || "Assignment",
            category, catColor: typeColor(category),
            date: parseDay(a.AssignmentDate) || parseDay(a.DueDate),
            scoreText, possible,
            pct: scoreText != null && score != null && possible ? (score / possible) * 100 : null,
            note: clean(a.Note),
            isNew: isNewItem(a), firstSeen: a.firstSeen || 0,
            className: name, color, sectionId: c.sectionId,
          };
        }).sort((x, y) => ts(y.date) - ts(x.date));

        const graded = assignments.filter(a => a.scoreText != null);
        let avg = num(c.average);
        if (avg === 0 && graded.length === 0) avg = null; // nothing graded yet, not a real zero
        const pcts = graded.map(a => a.pct).filter(v => v != null);
        const cats = {};
        for (const a of graded) if (a.pct != null) (cats[a.category || "Other"] ||= []).push(a.pct);
        const categories = Object.entries(cats)
          .map(([n, arr]) => ({ name: n, count: arr.length, avg: arr.reduce((s, v) => s + v, 0) / arr.length, color: typeColor(n) }))
          .sort((x, y) => y.count - x.count);

        return {
          sectionId: c.sectionId, name, color, monogram: monogram(name), avg,
          grade: clean(c.grade), teacher: clean(c.teacher), teacherEmail: c.teacherEmail || "",
          assignments, graded, categories, best: pcts.length ? Math.max(...pcts) : null,
        };
      });

      const bySection = new Map(classes.map(c => [String(c.sectionId), c]));
      const doneMap = (dash && dash.done) || {};
      const up = data.upcoming || {};
      const upcoming = (up.items || []).map((u, i) => {
        const cls = bySection.get(String(u.SectionID));
        const doneKey = doneKeyOf(u);
        const doneRemote = isTrue(u.IsCompleted);
        const doneLocal = !!doneMap[doneKey];
        const className = clean(u.CourseName) || clean(u.Class) || (cls ? cls.name : "");
        return {
          key: `${doneKey}-${i}`, doneKey,
          title: clean(u.Title) || "Untitled",
          description: clean(u.Description),
          className,
          color: cls ? cls.color : (namedColor(className) || OTHER_CLASS_COLORS[hashNum(className) % OTHER_CLASS_COLORS.length]),
          type: clean(u.Type),
          due: parseDay(u.DueDate),
          doneRemote, doneLocal, done: doneRemote || doneLocal,
          isNew: isNewItem(u), firstSeen: u.firstSeen || 0,
        };
      }).sort((a, b) => tsLast(a.due) - tsLast(b.due));

      const allGraded = classes.flatMap(c => c.graded);
      const fresh = [
        ...allGraded.filter(a => a.isNew).map(item => ({ kind: "grade", item })),
        ...upcoming.filter(u => u.isNew).map(item => ({ kind: "assignment", item })),
      ].sort((a, b) => b.item.firstSeen - a.item.firstSeen);

      const ranked = classes.filter(c => c.avg != null).sort((a, b) => b.avg - a.avg);
      const pastDue = num(up.pastDueCount);
      const ack = dash && dash.pastDueAck != null ? dash.pastDueAck : null;
      const mp = data.markingPeriod;

      return {
        classes, upcoming, fresh,
        pending: upcoming.filter(u => !u.done),
        completed: upcoming.filter(u => u.done),
        recent: [...allGraded].sort((a, b) => ts(b.date) - ts(a.date)).slice(0, 6),
        gradedCount: allGraded.length,
        overall: ranked.length ? ranked.reduce((s, c) => s + c.avg, 0) / ranked.length : null,
        best: ranked[0] || null,
        worst: ranked.length > 1 ? ranked[ranked.length - 1] : null,
        pastDue, pastDueAck: ack,
        pastDueVisible: pastDue == null ? null : Math.max(0, pastDue - (ack || 0)),
        updated: data.lastUpdated && data.lastUpdated.toDate ? data.lastUpdated.toDate() : null,
        mpLabel: mp ? titleCase(mp.description || `${mp.name} marking period`) : "",
      };
    }

    /* ---------- GitHub: refresh on open ---------- */
    async function gh(token, path, options = {}) {
      let res;
      try {
        res = await fetch(`https://api.github.com/repos/${GITHUB.repo}${path}`, {
          ...options,
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            ...(options.body ? { "Content-Type": "application/json" } : {}),
          },
        });
      } catch {
        throw new Error("Couldn't reach GitHub. Check your connection.");
      }
      if (!res.ok) {
        const hints = {
          401: "GitHub rejected the token. It may have expired; add a new one in Settings.",
          403: "The token needs Actions: Read and write permission.",
          404: `Can't find ${GITHUB.workflow} in ${GITHUB.repo}. Check the token's repository access.`,
          422: `The workflow needs a workflow_dispatch trigger and a "${GITHUB.branch}" branch.`,
        };
        throw new Error(hints[res.status] || `GitHub returned an error (${res.status}).`);
      }
      return res.status === 204 ? null : res.json();
    }
    const workflowBusy = async token => {
      const data = await gh(token, `/actions/workflows/${GITHUB.workflow}/runs?per_page=5`);
      return (data.workflow_runs || []).some(r => r.status !== "completed");
    };
    const dispatchWorkflow = token =>
      gh(token, `/actions/workflows/${GITHUB.workflow}/dispatches`, { method: "POST", body: JSON.stringify({ ref: GITHUB.branch }) });

    function useRefresh(uid, updatedMs, ready, notify) {
      const [token, setToken] = useState(undefined); // undefined = loading, null = not set
      const [phase, setPhase] = useState("idle");    // idle | starting | running
      const baseline = useRef(0);
      const tokenRef = useRef(token); tokenRef.current = token;
      const phaseRef = useRef(phase); phaseRef.current = phase;
      const updatedRef = useRef(updatedMs); updatedRef.current = updatedMs;

      useEffect(() => db.doc(`users/${uid}/private/github`).onSnapshot(
        snap => setToken(snap.get("token") || null),
        () => setToken(null)
      ), [uid]);

      const trigger = useCallback(async manual => {
        const tk = tokenRef.current;
        if (!tk) return "no-token";
        if (phaseRef.current !== "idle") return "busy";
        const last = Number(store.get(REFRESH_KEY)) || 0;
        if (!manual && Date.now() - last < REFRESH_COOLDOWN_MS) return "cooldown";
        setPhase("starting");
        try {
          if (!(await workflowBusy(tk))) await dispatchWorkflow(tk);
          store.set(REFRESH_KEY, String(Date.now()));
          baseline.current = updatedRef.current || 0;
          setPhase("running");
          return "started";
        } catch (err) {
          setPhase("idle");
          notify(err.message);
          return "error";
        }
      }, [notify]);

      // Finished once newer data shows up
      useEffect(() => {
        if (phase === "running" && updatedMs && updatedMs > baseline.current) {
          setPhase("idle");
          notify("Up to date");
        }
      }, [updatedMs, phase, notify]);

      useEffect(() => {
        if (phase !== "running") return;
        const id = setTimeout(() => {
          setPhase("idle");
          notify("Still running on GitHub. New data will appear when it finishes.");
        }, REFRESH_TIMEOUT_MS);
        return () => clearTimeout(id);
      }, [phase, notify]);

      // Refresh when the app opens or comes back to the foreground with old data
      useEffect(() => {
        if (!ready || !token) return;
        const check = () => {
          if (document.visibilityState !== "visible") return;
          const age = updatedRef.current ? Date.now() - updatedRef.current : Infinity;
          if (age > AUTO_REFRESH_AFTER_MS) trigger(false);
        };
        check();
        document.addEventListener("visibilitychange", check);
        return () => document.removeEventListener("visibilitychange", check);
      }, [ready, token, trigger]);

      const saveToken = async raw => {
        const tk = raw.trim();
        await workflowBusy(tk); // throws a readable error if the token doesn't work
        await db.doc(`users/${uid}/private/github`).set({ token: tk, savedAt: firebase.firestore.FieldValue.serverTimestamp() });
      };
      const removeToken = () => db.doc(`users/${uid}/private/github`).delete();

      return { token, phase, trigger, saveToken, removeToken };
    }

    /* ---------- Dashboard state (done items, cleared past due) ---------- */
    function useDash(uid) {
      const [dash, setDash] = useState({ done: {}, pastDueAck: null });
      useEffect(() => db.doc(`users/${uid}/state/dashboard`).onSnapshot(
        snap => setDash({ done: snap.get("done") || {}, pastDueAck: snap.get("pastDueAck") ?? null }),
        err => console.warn("Dashboard state unavailable", err)
      ), [uid]);
      const save = useCallback(next => db.doc(`users/${uid}/state/dashboard`).set(next), [uid]);
      return [dash, save];
    }

    /* ---------- Push notifications ---------- */
    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
    }

    async function registerDevice(uid) {
      await navigator.serviceWorker.register(SW_URL);
      const registration = await navigator.serviceWorker.ready;
      const token = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
      if (!token) throw new Error("No push token returned");
      const id = await sha256(token);
      const old = store.get(DEVICE_KEY);
      if (old && old !== id) await db.doc(`users/${uid}/devices/${old}`).delete().catch(() => {});
      await db.doc(`users/${uid}/devices/${id}`).set({
        token,
        userAgent: navigator.userAgent.slice(0, 200),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      store.set(DEVICE_KEY, id);
    }

    const PUSH_TEXT = {
      checking: "Checking this browser…",
      unsupported: "This browser can't receive web notifications. Chrome on Android works best.",
      "needs-key": "Add your Web Push key (VAPID_KEY) near the top of index.html.",
      blocked: "Blocked. Allow notifications for this site in your browser's site settings.",
      off: "Get a notification when a teacher posts a new assignment or grade.",
      on: "On for this device.",
      busy: "Working…",
    };

    function usePush(user, notify) {
      const [status, setStatus] = useState("checking");

      useEffect(() => {
        let alive = true;
        (async () => {
          let ok = "Notification" in window && "serviceWorker" in navigator && typeof firebase.messaging?.isSupported === "function";
          if (ok) ok = await Promise.resolve(firebase.messaging.isSupported()).catch(() => false);
          if (!alive) return;
          if (!ok) return setStatus("unsupported");
          if (VAPID_KEY.startsWith("PASTE")) return setStatus("needs-key");
          firebase.messaging().onMessage(p => {
            const n = p.notification || {};
            notify([n.title, n.body].filter(Boolean).join(" — ") || "New update");
          });
          if (Notification.permission === "denied") return setStatus("blocked");
          if (Notification.permission === "granted" && store.get(DEVICE_KEY)) {
            setStatus("on");
            registerDevice(user.uid).catch(err => console.warn("Push token refresh failed", err));
          } else {
            setStatus("off");
          }
        })();
        return () => { alive = false; };
      }, [user.uid]);

      const enable = async () => {
        setStatus("busy");
        try {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") { setStatus(permission === "denied" ? "blocked" : "off"); return; }
          await registerDevice(user.uid);
          setStatus("on");
          notify("Notifications are on for this device");
        } catch (err) {
          console.error(err);
          setStatus("off");
          notify(`Couldn't turn on notifications: ${err.message || err}`);
        }
      };

      const disable = async () => {
        setStatus("busy");
        try {
          const id = store.get(DEVICE_KEY);
          if (id) await db.doc(`users/${user.uid}/devices/${id}`).delete();
          const reg = await navigator.serviceWorker.getRegistration();
          const sub = reg && (await reg.pushManager.getSubscription());
          if (sub) await sub.unsubscribe();
          store.del(DEVICE_KEY);
          setStatus("off");
          notify("Notifications are off for this device");
        } catch (err) {
          console.error(err);
          setStatus("on");
          notify("Couldn't turn off notifications");
        }
      };

      return { status, enable, disable };
    }

    /* ---------- Small hooks ---------- */
    function useToast() {
      const [toast, setToast] = useState(null);
      const timer = useRef();
      const hide = useCallback(() => { clearTimeout(timer.current); setToast(null); }, []);
      const show = useCallback((text, action) => {
        clearTimeout(timer.current);
        setToast({ text, action, id: Date.now() });
        timer.current = setTimeout(() => setToast(null), action ? 6000 : 3500);
      }, []);
      return [toast, show, hide];
    }

    function useMinuteTick() {
      const [, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick(t => t + 1), 60000);
        return () => clearInterval(id);
      }, []);
    }

    function useCompact(ref) {
      const [compact, setCompact] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el || !("IntersectionObserver" in window)) return;
        const io = new IntersectionObserver(([e]) => setCompact(!e.isIntersecting), { rootMargin: "-56px 0px 0px 0px" });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return compact;
    }

      useEffect(() => {
        const onKey = e => e.key === "Escape" && closeRef.current();
        window.addEventListener("keydown", onKey);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return () => {
          window.removeEventListener("keydown", onKey);
          document.body.style.overflow = prevOverflow;
        };
      }, []);

      const style = {
        ...(tint ? { background: `radial-gradient(120% 45% at 0% 0%, color-mix(in srgb, ${tint} 22%, transparent), transparent 70%), var(--surface)` } : {}),

    function GitHubSetup({ refresh, notify }) {
      const [value, setValue] = useState("");

      const [error, setError] = useState(null);

      if (refresh.token === undefined) return <div className="list"><div className="row"><span className="spinner" /></div></div>;

      if (refresh.token) {
        return (
          <div className="list">

        );
      }

      const save = async e => {
        e.preventDefault();
        setBusy(true);
        setError(null);

          await refresh.saveToken(value);
          setValue("");
          notify("Connected. The app now refreshes when you open it.");

        setBusy(false);

      return (
        <form className="card setup" onSubmit={save}>

            </div>
            <div className="stats">
              <Stat icon="book" color="var(--blue)" value={model.classes.length} label="Classes" onClick={() => goTo("classes")} />
              <Stat icon="chart" color="var(--green)" value={model.gradedCount} label="Scores" />
              <Stat icon="list" color="var(--yellow)" value={model.pending.length} label="To do" onClick={() => goTo("upcoming")} />
              <Stat icon="alert" color="var(--red)" value={model.pastDueVisible ?? "—"} label="Past due" onClick={() => goTo("upcoming")} />
            </div>
          </div>

          {model.fresh.length > 0 && (
            <Section icon="sparkle" color="var(--violet)" title="New" note="last 3 days">
              <div className="list">
                {model.fresh.map((f, i) => f.kind === "grade"
                  ? <GradeRow key={`g${i}`} a={f.item} showClass onClick={() => openClass(f.item.sectionId)} />
                  : <UpcomingRow key={`u${i}`} item={f.item} onToggle={onToggle} />)}
              </div>
            </Section>
          )}

          <Section icon="clock" color="var(--orange)" title="Due soon" action={model.pending.length > soon.length ? { label: "See all", onClick: () => goTo("upcoming") } : null}>
            {soon.length
              ? <div className="list">{soon.map(u => <UpcomingRow key={u.key} item={u} onToggle={onToggle} />)}</div>
              : <Empty>Nothing due right now.</Empty>}
          </Section>

          {model.classes.length > 0 && (
            <Section icon="book" color="var(--blue)" title="Your classes" action={{ label: "See all", onClick: () => goTo("classes") }}>
              <div className="scroller">{model.classes.map(c => <ClassTile key={c.sectionId} c={c} onClick={() => openClass(c.sectionId)} />)}</div>
            </Section>
          )}

          <Section icon="chart" color="var(--green)" title="Recent scores">
            {model.recent.length
              ? <div className="list">{model.recent.map((a, i) => <GradeRow key={i} a={a} showClass onClick={() => openClass(a.sectionId)} />)}</div>
              : <Empty icon="chart" color="var(--blue)">No scores yet this marking period.</Empty>}
          </Section>
        </>
      );
    }

    function ClassesView({ model, openClass }) {
      if (!model.classes.length) return <Empty icon="book" color="var(--blue)">No classes found.</Empty>;
      return model.classes.map(c => <ClassCard key={c.sectionId} c={c} onClick={() => openClass(c.sectionId)} />);
    }

    function UpcomingView({ model, onToggle, onMarkAll, onClearPastDue }) {
      const [filter, setFilter] = useState("todo");
      const items = filter === "todo" ? model.pending : filter === "done" ? model.completed : model.upcoming;
      const groups = {};
      if (filter === "done") groups.Done = items;
      else for (const u of items) (groups[bucket(u.due)] ||= []).push(u);
      const order = filter === "done" ? [["Done", "var(--green)"]] : BUCKETS;

      return (
        <>
          {model.pastDueVisible > 0 && (
            <div className="alert-card">
              <span className="icon"><Icon name="alert" /></span>
              <div className="row-main">
                <b>{model.pastDueVisible} past due</b>
                <span>PlusPortals only shares the count, not the list.</span>
              </div>
              <button className="btn small ghost" onClick={onClearPastDue}>Clear</button>
            </div>
          )}

          <div className="toolbar">
            <div className="seg">
              <button className={filter === "todo" ? "on" : ""} onClick={() => setFilter("todo")}>To do<span>{model.pending.length}</span></button>
              <button className={filter === "done" ? "on" : ""} onClick={() => setFilter("done")}>Done</button>
              <button className={filter === "all" ? "on" : ""} onClick={() => setFilter("all")}>All</button>
            </div>
            {filter === "todo" && model.pending.length > 0 && (
              <button className="btn-pill" onClick={onMarkAll}><Icon name="checks" size={17} stroke={2.2} /> Mark all done</button>
            )}
          </div>

          {!items.length && (
            filter === "todo" ? <Empty>You're all caught up.</Empty>
            : filter === "done" ? <Empty icon="list" color="var(--blue)">Nothing marked done yet.</Empty>
            : <Empty icon="calendar" color="var(--blue)">No upcoming coursework posted.</Empty>
          )}

          {order.filter(([k]) => groups[k] && groups[k].length).map(([k, color]) => (
            <Section key={k} dot color={color} title={k} note={`${groups[k].length}`}>
              <div className="list">{groups[k].map(u => <UpcomingRow key={u.key} item={u} onToggle={onToggle} />)}</div>
            </Section>
          ))}
        </>
      );
    }

    const Skeleton = () => (
      <>
        <div className="sk" style={{ height: 190 }} />
        <div className="sk" style={{ height: 80 }} />
        <div className="sk" style={{ height: 80 }} />
        <div className="sk" style={{ height: 160 }} />
      </>
    );

    /* ---------- Screens ---------- */
    const GLOWS = {
      home: ["rgba(79,140,255,.24)", "rgba(160,132,255,.2)"],
      classes: ["rgba(60,203,127,.18)", "rgba(79,140,255,.2)"],
      upcoming: ["rgba(255,138,61,.2)", "rgba(244,183,64,.14)"],
    };

    function Dashboard({ user }) {
      const [state, setState] = useState({ status: "loading", data: null, error: null });
      const [tab, setTab] = useState("home");
      const [openSection, setOpenSection] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [toast, showToast, hideToast] = useToast();
      const [dash, saveDash] = useDash(user.uid);
      const push = usePush(user, showToast);
      const titleRef = useRef(null);
      const compact = useCompact(titleRef);
      useMinuteTick();

      useEffect(() => db.doc(`users/${user.uid}/grades/current`).onSnapshot(
        snap => setState({ status: snap.exists ? "ready" : "empty", data: snap.exists ? snap.data() : null, error: null }),
        error => setState({ status: "error", data: null, error })
      ), [user.uid]);

      useEffect(() => { window.scrollTo(0, 0); }, [tab]);

      const model = useMemo(() => (state.data ? buildModel(state.data, dash) : null), [state.data, dash]);
      const updatedMs = model && model.updated ? model.updated.getTime() : null;
      const refresh = useRefresh(user.uid, updatedMs, state.status !== "loading", showToast);
      const openClass = model && openSection != null ? model.classes.find(c => c.sectionId === openSection) : null;

      // Saving done items / cleared past due
      const dashRef = useRef(dash); dashRef.current = dash;
      const modelRef = useRef(model); modelRef.current = model;
      const writeDash = useCallback(async patch => {
        const cur = dashRef.current;
        const next = { done: cur.done || {}, pastDueAck: cur.pastDueAck ?? null, ...patch };
        const m = modelRef.current;
        if (m) {
          const live = new Set(m.upcoming.map(u => u.doneKey));
          const cutoff = Date.now() - 30 * 864e5;
          next.done = Object.fromEntries(Object.entries(next.done).filter(([k, t]) => live.has(k) || t > cutoff));
        }
        try {
          await saveDash(next);
        } catch (err) {
          showToast(err.code === "permission-denied" ? "Couldn't save. Publish the updated Firestore rules." : "Couldn't save that change.");
        }
      }, [saveDash, showToast]);

      const toggleDone = item => {
        if (item.doneRemote) return showToast("Already marked complete in PlusPortals");
        const done = { ...dashRef.current.done };
        if (done[item.doneKey]) delete done[item.doneKey];
        else done[item.doneKey] = Date.now();
        writeDash({ done });
      };
      const markAllDone = () => {
        const targets = model.pending;
        if (!targets.length) return;
        const before = { ...dashRef.current.done };
        const done = { ...before };
        const now = Date.now();
        targets.forEach(u => { done[u.doneKey] = now; });
        writeDash({ done });
        showToast(`Marked ${targets.length} as done`, { label: "Undo", onClick: () => writeDash({ done: before }) });
      };
      const clearPastDue = () => {
        const before = dashRef.current.pastDueAck ?? null;
        const count = model.pastDueVisible;
        writeDash({ pastDueAck: model.pastDue });
        showToast(`Cleared ${count} past due`, { label: "Undo", onClick: () => writeDash({ pastDueAck: before }) });
      };
      const resetPastDue = () => writeDash({ pastDueAck: null });

      // If PlusPortals' past-due count drops below what you cleared, follow it down
      useEffect(() => {
        if (model && model.pastDue != null && dash.pastDueAck != null && model.pastDue < dash.pastDueAck) {
          writeDash({ pastDueAck: model.pastDue });
        }
      }, [model && model.pastDue, dash.pastDueAck]);

      const doRefresh = async () => {
        const result = await refresh.trigger(true);
        if (result === "no-token") showToast("Connect GitHub to refresh from here", { label: "Set up", onClick: () => setSettingsOpen(true) });
      };

      const copy = async text => {
        try { await navigator.clipboard.writeText(text); showToast("Copied"); }
        catch { showToast("Couldn't copy. Long-press to select it instead."); }
      };

      const titles = { home: "Grades", classes: "Classes", upcoming: "Upcoming" };
      let eyebrow = "";
      if (tab === "home") eyebrow = `${greeting()} · ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}`;
      if (tab === "classes" && model) eyebrow = [`${model.classes.length} classes`, model.mpLabel].filter(Boolean).join(" · ");
      if (tab === "upcoming" && model) eyebrow = [`${model.pending.length} to do`, model.pastDueVisible ? `${model.pastDueVisible} past due` : ""].filter(Boolean).join(" · ");

      const dots = {
        classes: !!model?.fresh.some(f => f.kind === "grade"),
        upcoming: !!model?.fresh.some(f => f.kind === "assignment"),
      };
      const tabs = [["home", "Home", "home"], ["classes", "Classes", "book"], ["upcoming", "Upcoming", "calendar"]];
      const actions = (
        <div className="actions">
          <IconButton label="Refresh" onClick={doRefresh} spinning={refresh.phase !== "idle"}><Icon name="refresh" /></IconButton>
          <IconButton label="Settings" onClick={() => setSettingsOpen(true)}><Icon name="settings" /></IconButton>
        </div>
      );

      return (
        <div className="app">
          <div className={`topbar${compact ? " show" : ""}`}>
            <div className="topbar-inner"><span>{titles[tab]}</span>{actions}</div>
          </div>

          <header className="hero" style={{ "--g1": GLOWS[tab][0], "--g2": GLOWS[tab][1] }}>
            {actions}
            {eyebrow && <div className="eyebrow">{eyebrow}</div>}
            <h1 ref={titleRef}>{titles[tab]}</h1>
            <StatusPill phase={refresh.phase} updated={model?.updated} />
          </header>

          <main className="content">
            {state.status === "loading" && <Skeleton />}
            {state.status === "empty" && (
              <div className="card notice">
                <p><b>No grades for this account yet.</b> Set <code>DASHBOARD_UID</code> in scraper.js to this UID, then run the workflow:</p>
                <button className="uid" onClick={() => copy(user.uid)}><code>{user.uid}</code><Icon name="copy" size={18} /></button>
              </div>
            )}
            {state.status === "error" && (
              <div className="card notice">
                <p><b>Can't read your grades.</b> {state.error?.code === "permission-denied"
                  ? "Make sure the Firestore rules are published and DASHBOARD_UID matches this UID:"
                  : state.error?.message}</p>
                <button className="uid" onClick={() => copy(user.uid)}><code>{user.uid}</code><Icon name="copy" size={18} /></button>
              </div>
            )}
            {model && tab === "home" && <HomeView model={model} goTo={setTab} openClass={setOpenSection} onToggle={toggleDone} />}
            {model && tab === "classes" && <ClassesView model={model} openClass={setOpenSection} />}
            {model && tab === "upcoming" && <UpcomingView model={model} onToggle={toggleDone} onMarkAll={markAllDone} onClearPastDue={clearPastDue} />}
          </main>

          <nav className="tabbar">
            <div className="tabbar-inner">
              {tabs.map(([id, label, icon]) => (
                <button key={id} className={`tab${tab === id ? " active" : ""}`} onClick={() => setTab(id)} aria-current={tab === id ? "page" : undefined}>
                  <span className="ico"><Icon name={icon} />{dots[id] && <i className="tab-dot" />}</span>
                  {label}
                </button>
              ))}
            </div>
          </nav>

          {openClass && <ClassSheet cls={openClass} onClose={() => setOpenSection(null)} />}
          {settingsOpen && (
            <SettingsSheet user={user} push={push} refresh={refresh} model={model}
              onClose={() => setSettingsOpen(false)} onCopy={copy} onResetPastDue={resetPastDue} notify={showToast} />
          )}
          {toast && (
            <div className="toast" key={toast.id} role="status">
              <span>{toast.text}</span>
              {toast.action && <button onClick={() => { toast.action.onClick(); hideToast(); }}>{toast.action.label}</button>}
            </div>
          )}
        </div>
      );
    }

    function authError(err) {
      const code = err && err.code;
      if (["auth/invalid-credential", "auth/invalid-login-credentials", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(code)) return "Wrong email or password.";
      if (code === "auth/too-many-requests") return "Too many attempts. Try again in a few minutes.";
      if (code === "auth/network-request-failed") return "No connection. Check your internet and try again.";
      if (code === "auth/operation-not-allowed") return "Email/Password sign-in is turned off in Firebase Authentication.";
      return (err && err.message) || "Something went wrong.";
    }

    function SignIn() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);

      const submit = async e => {
        e.preventDefault();
        setBusy(true);
        setMsg(null);
        try { await auth.signInWithEmailAndPassword(email.trim(), password); }
        catch (err) { setMsg({ error: true, text: authError(err) }); setBusy(false); }
      };
      const reset = async () => {
        if (!email.trim()) return setMsg({ error: true, text: "Enter your email first." });
        try { await auth.sendPasswordResetEmail(email.trim()); setMsg({ text: "Password reset email sent." }); }
        catch (err) { setMsg({ error: true, text: authError(err) }); }
      };

      return (
        <div className="auth">
          <AppIcon size={64} />
          <h1>Grades</h1>
          <p className="muted">Sign in with your dashboard account.</p>
          <form className="auth-form" onSubmit={submit}>
            <input className="field" type="email" inputMode="email" autoComplete="username" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required />
            <input className="field" type="password" autoComplete="current-password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required />
            {msg && <p className={`form-msg ${msg.error ? "error" : "ok"}`}>{msg.text}</p>}
            <button className="btn" type="submit" disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
          </form>
          <button className="link" type="button" onClick={reset}>Forgot password?</button>
        </div>
      );
    }

    const Splash = () => <div className="splash"><AppIcon size={56} /></div>;

    const SetupNotice = () => (
      <div className="auth">
        <AppIcon size={64} />
        <h1>Almost there</h1>
        <p className="muted">Paste your Firebase web config into <code>FIREBASE_CONFIG</code> near the top of index.html, then reload.</p>
      </div>
    );

    function App() {
      const [user, setUser] = useState(undefined);
      useEffect(() => auth.onAuthStateChanged(u => setUser(u || null)), []);
      if (user === undefined) return <Splash />;
      return user ? <Dashboard user={user} /> : <SignIn />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(configured ? <App /> : <SetupNotice />);
  </script>
</body>
</html>
